name: GitOps Terraform Apply
 
on:
  push:
    branches: [ "main" ]
    paths:
      - "AWS_Capstone_Code_Bundle/Project_18_GitOps_Infra_Deployment/**"
      - ".github/workflows/gitops-apply.yml"
 
jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS_Capstone_Code_Bundle/Project_18_GitOps_Infra_Deployment
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan -out=tfplan.binary
      - uses: actions/upload-artifact@v4
        with:
          name: gitops-plan
          path: AWS_Capstone_Code_Bundle/Project_18_GitOps_Infra_Deployment/tfplan.binary
 
  apply:
    name: Terraform Apply (Manual Approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: AWS_Capstone_Code_Bundle/Project_18_GitOps_Infra_Deployment
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: gitops-plan
          path: AWS_Capstone_Code_Bundle/Project_18_GitOps_Infra_Deployment
      - run: terraform init
      - run: terraform apply -auto-approve tfplan.binary
