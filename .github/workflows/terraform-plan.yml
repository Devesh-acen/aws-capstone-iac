name: Terraform Plan CI
 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
 
jobs:
  terraform-plan:
    name: Terraform Plan & Upload Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AWS_Capstone_Code_Bundle/Project_01_EC2_Web_Server_Terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        run: terraform plan -var="aws_region=ap-southeast-2" -out=tfplan.binary -no-color
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-artifact
          path: AWS_Capstone_Code_Bundle/Project_01_EC2_Web_Server_Terraform/tfplan.binary
          retention-days: 7
