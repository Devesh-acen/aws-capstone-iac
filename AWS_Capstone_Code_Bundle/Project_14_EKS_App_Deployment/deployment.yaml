apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-web
  template:
    metadata:
      labels:
        app: capstone-web
    spec:
      containers:
        - name: web
          # Replace with your ECR image URI from Project 13 (or keep nginx:alpine for quick test)
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-web-svc
spec:
  type: LoadBalancer
  selector:
    app: capstone-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
