---
- name: Configure Nginx Web Server Remotely
  hosts: webservers
  become: true
  tasks:
    - name: Install Nginx package
      package:
        name: nginx
        state: present

    - name: Ensure Nginx service is started and enabled
      service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy custom landing page
      copy:
        content: |
          <!DOCTYPE html>
          <html>
            <head><title>Ansible Configured Server</title></head>
            <body style="font-family:sans-serif;text-align:center;margin-top:60px;">
              <h1>Project 15: Web Server Configured via Ansible</h1>
            </body>
          </html>
        dest: /usr/share/nginx/html/index.html
        mode: '0644'
